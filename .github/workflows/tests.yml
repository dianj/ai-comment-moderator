name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      # No GPU or LM Studio in CI: the tests use a scripted fake LLM (tests/fake_lmstudio.py).
      # The model itself is measured offline with evals/run_evals.py.
      - name: Run tests with coverage
        run: >
          python -m pytest -v
          --cov=moderator --cov-report=term-missing
          --tracing=retain-on-failure --screenshot=only-on-failure --output=test-results

      - name: Upload Playwright traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-traces
          path: test-results/
